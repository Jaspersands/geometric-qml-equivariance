[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-qml-equivariance"
version = "0.4.0"
description = "Geometric QML: SU(2)-equivariant quantum circuits, Dynamical Lie Algebra closure, barren-plateau scaling, Fermi-Hubbard symmetries and Google Sycamore transpilation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jasper Sands" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pennylane>=0.35.0",
    "cirq>=1.3.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
geometric-qml = "geometric_qml.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
