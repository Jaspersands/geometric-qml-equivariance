[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-qml-equivariance"
version = "0.1.0"
description = "Geometric Quantum Machine Learning: SU(2) and Lattice-Equivariant Quantum Neural Networks vs. Barren Plateaus with Google Sycamore Transpilation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Jasper Sands"}]
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "pennylane>=0.35.0",
    "cirq>=1.2.0",
    "matplotlib>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["src"]
